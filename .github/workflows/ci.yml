name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: knowledgeai
          POSTGRES_USER: knowledgeai
          POSTGRES_PASSWORD: knowledgeai_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U knowledgeai -d knowledgeai"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://knowledgeai:knowledgeai_dev@127.0.0.1:5432/knowledgeai?schema=public
      AUTH_SECRET: knowledgeai-e2e-secret
      E2E_FAST_REVIEW: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Prisma generate
        run: npm run db:generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build Next.js app
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore